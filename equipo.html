async function derive(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:dec(B.salt),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);}
async function abrir(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(B.nonce)},key,dec(B.ct));

 document.open();document.write(new TextDecoder().decode(pt));document.close();}
async function go(){try{const key=await derive(document.getElementById('gpw').value);await abrir(key);
 const raw=await crypto.subtle.exportKey('raw',key);localStorage.setItem(LS,btoa(String.fromCharCode(...new Uint8Array(raw))));
 }catch(e){document.getElementById('gerr').style.display='block'}}
document.getElementById('gbtn').onclick=go;document.getElementById('gpw').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
